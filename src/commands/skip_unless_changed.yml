description: >
  Ends the job, successfully, on a branch that changed none of the given paths since it left
  the base branch, so a required check still reports. The base branch always runs everything,
  and so does a branch whose merge base cannot be found.

parameters:
  paths:
    description: Space-separated paths passed to git diff, e.g. "payments_service .circleci/config.yml".
    type: string
  base_branch:
    description: The branch that always runs everything, and that the changes are compared with.
    type: string
    default: master

steps:
  - run:
      name: Skip unless << parameters.paths >> changed
      command: |
        paths="<< parameters.paths >>"
        base_branch="<< parameters.base_branch >>"

        if [ "$CIRCLE_BRANCH" = "$base_branch" ]; then exit 0; fi

        if ! git fetch --quiet origin "$base_branch" || ! base=$(git merge-base HEAD FETCH_HEAD); then
          echo "Could not find where this branch left ${base_branch}, so running everything."
          exit 0
        fi

        # shellcheck disable=SC2086
        if git diff --quiet "$base" HEAD -- $paths; then
          echo "Nothing in ${paths} changed since ${base}, so this job has nothing to check."
          circleci-agent step halt
        else
          echo "${paths} changed since ${base}, so running everything."
        fi
